name: Verify archive
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated output, evidence references, and local links
        run: python3 scripts/verify.py
      - name: Check JavaScript syntax
        run: node --check assets/app.js
